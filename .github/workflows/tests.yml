name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/benchmark.py
      - run: python scripts/batch_advice.py data/sensor_samples.csv --mode evidence
      - run: python scripts/analyze_experiments.py reports/benchmark/results.json
      - run: python scripts/offline_check.py --mode evidence
